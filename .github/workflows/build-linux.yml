name: Full build - Linux

# Full packaged build (~1 GB app). Expensive, so it runs only before a merge, never on plain pushes:
#   - manually (workflow_dispatch), with a configurable runner label
#   - when a PR is marked ready for review, or labeled `ready-to-merge`
#   - in the merge queue (merge_group)
#   - on version tags (v*), which also publish a GitHub Release
# Defaults to the free GitHub-hosted runner. For a larger or self-hosted runner, pass `runner` or set
# the repository variable BUILD_RUNNER_LINUX.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (ubuntu-latest, a larger-runner label, or self-hosted)
        type: string
        default: ubuntu-latest
      max_old_space_size:
        description: Node heap cap for gulp, in MB
        type: string
        default: "7168"
      swap_gb:
        description: Swap to add on Linux runners, in GB (0 = none)
        type: string
        default: "10"
  pull_request:
    types: [ready_for_review, labeled]
  merge_group:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: build-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'ready_for_review') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge')
    runs-on: ${{ inputs.runner || vars.BUILD_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      MAX_OLD_SPACE_SIZE: ${{ inputs.max_old_space_size || vars.BUILD_MAX_OLD_SPACE_SIZE || '7168' }}
      SWAP_GB: ${{ inputs.swap_gb || '10' }}
      CI_BUILD: "yes"
      OS_NAME: linux
      VSCODE_ARCH: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        run: |
          . fork/upstream.env
          . fork/branding.env
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vscodium=${VSCODIUM_REF}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: fork/ci/free-disk.sh

      - name: Add swap
        if: env.SWAP_GB != '0'
        run: fork/ci/add-swap.sh "$SWAP_GB"

      - name: Pick build directory
        run: echo "WORKDIR=$(fork/ci/workdir.sh)" >> "$GITHUB_ENV"

      - name: Start resource monitor
        run: fork/ci/monitor.sh start "$RUNNER_TEMP/resources.log" "$WORKDIR"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev jq xvfb

      - name: Cache npm and Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/node-gyp
          key: build-linux-${{ steps.pins.outputs.vscodium }}-${{ hashFiles('package-lock.json') }}
          restore-keys: build-linux-${{ steps.pins.outputs.vscodium }}-

      - name: Install repo dependencies (engine + extension)
        run: npm ci

      - name: Prepare (VSCodium patches + ours + npm ci + built-in extension)
        run: |
          start=$(date +%s)
          fork/scripts/prepare-vscodium.sh "$WORKDIR"
          echo "PREPARE_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Build
        run: |
          start=$(date +%s)
          fork/scripts/build.sh "$WORKDIR"
          echo "BUILD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Core unit tests (contrib/agentReview)
        run: fork/scripts/test-core.sh "$WORKDIR"

      - name: Smoke test
        run: xvfb-run -a "$WORKDIR/vscodium/VSCode-linux-x64/bin/${{ steps.pins.outputs.binary }}" --version

      - name: Package
        run: |
          tar -czf "$RUNNER_TEMP/${{ steps.pins.outputs.binary }}-linux-x64.tar.gz" -C "$WORKDIR/vscodium/VSCode-linux-x64" .
          ls -lh "$RUNNER_TEMP"/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 7

      - name: Resource summary
        if: always()
        run: |
          {
            echo "### Linux build resources"
            echo "- runner: \`${{ inputs.runner || vars.BUILD_RUNNER_LINUX || 'ubuntu-latest' }}\`, $(nproc) vCPU, $(free -g | awk '/^Mem:/ {print $2}') GB RAM, heap cap ${MAX_OLD_SPACE_SIZE} MB, swap ${SWAP_GB} GB"
            echo "- prepare: ${PREPARE_S:-n/a} s, build: ${BUILD_S:-n/a} s"
            echo "- $(fork/ci/monitor.sh summary "$RUNNER_TEMP/resources.log")"
            echo "- disk at end: $(df -h "$WORKDIR" | awk 'NR==2 {print $3 " used, " $4 " free"}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-resources
          path: ${{ runner.temp }}/resources.log
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x64
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Unsigned build of $TAG."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*.tar.gz
