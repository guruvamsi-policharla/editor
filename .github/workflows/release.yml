name: Release

# Cuts a release. Runs ONLY when you push a version tag (git tag v0.1.0 && git push origin v0.1.0) or press
# "Run workflow" on this workflow in the Actions tab and type a version. Never on pushes to main or on PRs.
#
# Builds editor.app for Apple Silicon only (Intel users build from source), cross-compiled on the free standard
# macos-15-intel runner (~14 GB RAM; the 7 GB arm64 macos-latest runner ran out of memory), with fork/scripts/build-macos.sh,
# Developer ID signs + notarizes it when the Apple secrets are set (falls back to ad-hoc otherwise), packages a .dmg
# with sha256 files, and publishes a DRAFT GitHub Release (creating the tag for a manual run).
# Standard GitHub-hosted runners are free on public repos.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (creates tag v0.1.0 on the selected branch's head)
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            v="${INPUT_VERSION#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$v' is not a version like 0.1.0"; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" >/dev/null 2>&1; then
            echo "::error::tag v$v already exists; push nothing and pick a new version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15-intel # cross-compiles arm64; see header
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # VSCodium publish-stable-macos.yml uses 12288 on 7 GB arm64 runners (macOS swaps); 8192 OOMed after compile-src.
      MAX_OLD_SPACE_SIZE: "12288"
      CI_BUILD: "yes"
      OS_NAME: osx
      VSCODE_ARCH: ${{ matrix.arch }}
      npm_config_arch: ${{ matrix.arch }} # arm64 Electron headers + native modules on the Intel runner
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        run: |
          . fork/upstream.env
          . fork/branding.env
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vscodium=${VSCODIUM_REF}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"
          echo "app=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "WORKDIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"

      - name: Free disk space
        run: fork/ci/free-disk.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install jq
        run: command -v jq || brew install jq

      - name: Build (fork/scripts/build-macos.sh, prepare + compile + package + ad-hoc sign)
        run: fork/scripts/build-macos.sh "$WORKDIR"

      - name: Sign (Developer ID when secrets present, else ad-hoc) and verify
        id: sign
        env:
          APP_NAME: ${{ steps.pins.outputs.app }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$WORKDIR/vscodium/VSCode-darwin-$VSCODE_ARCH/$APP_NAME.app"
          fork/scripts/prune-macos-arch.sh "$app" "$VSCODE_ARCH" # also done by build.sh; idempotent
          if [[ -n "${MACOS_CERTIFICATE_P12}" && -n "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "Developer ID signing"
            fork/scripts/sign-macos-developer-id.sh "$app"
            echo "SIGNING=developer-id" >> "$GITHUB_ENV"
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple cert secrets missing; falling back to ad-hoc sign (not notarized)"
            fork/scripts/sign-macos-adhoc.sh "$app"
            echo "SIGNING=adhoc" >> "$GITHUB_ENV"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi
          codesign --verify --deep --strict "$app"
          # Cross-compiled: don't run it here; check every Mach-O in the bundle is arm64 instead.
          lipo -archs "$app/Contents/MacOS/"*
          bad=$(find "$app" -type f \( -perm -u+x -o -name '*.node' -o -name '*.dylib' \) -exec sh -c 'file -b "$1" | grep -q "Mach-O" && ! lipo -archs "$1" | grep -qw "$VSCODE_ARCH" && echo "$1"' _ {} \; | head -20)
          if [[ -n "$bad" ]]; then echo "::error::Mach-O files without $VSCODE_ARCH:"; echo "$bad"; exit 1; fi
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Package .dmg
        env:
          APP_NAME: ${{ steps.pins.outputs.app }}
          BIN: ${{ steps.pins.outputs.binary }}
        run: |
          out="$RUNNER_TEMP/dist"; mkdir -p "$out" "$RUNNER_TEMP/dmg"
          base="$BIN-$VERSION-darwin-$VSCODE_ARCH"
          ditto "$APP" "$RUNNER_TEMP/dmg/$APP_NAME.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          # hdiutil sometimes fails with "Resource busy" on hosted runners; retry a few times.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "$APP_NAME" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "$out/$base.dmg" && break
            [[ $i == 5 ]] && exit 1; echo "hdiutil failed, retrying ($i)"; sleep 10
          done
          hdiutil verify "$out/$base.dmg"
          echo "DMG=$out/$base.dmg" >> "$GITHUB_ENV"
          echo "DMG_BASE=$base" >> "$GITHUB_ENV"
          echo "DIST_OUT=$out" >> "$GITHUB_ENV"

      - name: Notarize and staple .dmg (Developer ID builds only)
        if: steps.sign.outputs.mode == 'developer-id'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          missing=
          for v in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!v}" ]]; then echo "::error::secret $v is empty"; missing=1; fi
          done
          [[ -z "$missing" ]] || exit 1
          # Sign the .dmg with Developer ID (Gatekeeper expects a signed disk image), then notarize + staple it.
          fork/scripts/sign-macos-dmg.sh "$DMG"
          fork/scripts/notarize-macos.sh "$DMG"

      - name: Checksums
        run: |
          cd "$DIST_OUT"
          shasum -a 256 "$DMG_BASE.dmg" > "$DMG_BASE.dmg.sha256"
          echo "${SIGNING:-adhoc}" > SIGNING.txt
          cat ./*.sha256
          ls -lh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: darwin-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          # Don't attach the internal marker to the release assets.
          signing="$(cat dist/SIGNING.txt 2>/dev/null || echo adhoc)"
          rm -f dist/SIGNING.txt
          echo "SIGNING=$signing" >> "$GITHUB_ENV"

      - name: Create DRAFT GitHub Release (test the .dmg, then publish it by hand; publishing creates the tag on a manual run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ "${SIGNING}" == "developer-id" ]]; then
            notes="Apple Silicon only (Developer ID signed and notarized). Intel: build from source."
          else
            notes="Apple Silicon only (ad-hoc signed, not notarized — Apple secrets were missing). Intel: build from source."
          fi
          # Exclude nothing else; SHA256SUMS + .dmg + .sha256 only.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" dist/*
          fi

