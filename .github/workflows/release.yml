name: Release

# Cuts a release. Runs ONLY when you push a version tag (git tag v0.1.0 && git push origin v0.1.0) or press
# "Run workflow" on this workflow in the Actions tab and type a version. Never on pushes to main or on PRs.
#
# Builds editor.app for Apple Silicon (macos-latest) and Intel (macos-15-intel) with fork/scripts/build-macos.sh,
# ad-hoc signs it (no Apple Developer ID, not notarized), packages a .dmg and a .zip per arch with sha256 files,
# and publishes a GitHub Release (creating the tag for a manual run).
# Standard GitHub-hosted runners are free on public repos.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (creates tag v0.1.0 on the selected branch's head)
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            v="${INPUT_VERSION#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$v' is not a version like 0.1.0"; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" >/dev/null 2>&1; then
            echo "::error::tag v$v already exists; push nothing and pick a new version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      MAX_OLD_SPACE_SIZE: "8192"
      CI_BUILD: "yes"
      OS_NAME: osx
      VSCODE_ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        run: |
          . fork/upstream.env
          . fork/branding.env
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vscodium=${VSCODIUM_REF}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"
          echo "app=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "WORKDIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"

      - name: Free disk space
        run: fork/ci/free-disk.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install jq
        run: command -v jq || brew install jq

      - name: Build (fork/scripts/build-macos.sh, prepare + compile + package + ad-hoc sign)
        run: fork/scripts/build-macos.sh "$WORKDIR"

      - name: Ad-hoc sign and verify
        env:
          APP_NAME: ${{ steps.pins.outputs.app }}
        run: |
          app="$WORKDIR/vscodium/VSCode-darwin-$VSCODE_ARCH/$APP_NAME.app"
          fork/scripts/sign-macos-adhoc.sh "$app"
          codesign --verify --deep --strict "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Package .dmg and .zip
        env:
          APP_NAME: ${{ steps.pins.outputs.app }}
          BIN: ${{ steps.pins.outputs.binary }}
        run: |
          out="$RUNNER_TEMP/dist"; mkdir -p "$out" "$RUNNER_TEMP/dmg"
          base="$BIN-$VERSION-darwin-$VSCODE_ARCH"
          ditto "$APP" "$RUNNER_TEMP/dmg/$APP_NAME.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "$out/$base.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$out/$base.zip"
          cd "$out"
          for f in "$base.dmg" "$base.zip"; do shasum -a 256 "$f" > "$f.sha256"; done
          cat ./*.sha256
          ls -lh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: darwin-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Create GitHub Release (creates the tag on a manual run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes="Ad-hoc signed, not notarized (no Apple Developer ID).

          Install: download the .dmg for your Mac (arm64 = Apple Silicon, x64 = Intel).

          First launch: macOS blocks the app once. Open **System Settings > Privacy & Security** and click **Open Anyway**, or run \`xattr -dr com.apple.quarantine /Applications/editor.app\`."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" dist/*
          fi

