name: Full build - macOS

# Manual only (workflow_dispatch), with a configurable runner label, because macOS minutes bill at 10x on private
# repos. Run it on a v* tag to also publish a GitHub Release: gh workflow run build-macos.yml --ref v1.2.3
# Default runner: macos-latest (Apple Silicon). It runs the same fork/scripts/build-macos.sh as a local build.
# The app is ad-hoc signed (no Developer ID yet) and not notarized: after downloading the zip, users must run
# `xattr -dr com.apple.quarantine editor.app` (docs/build-macos.md). macOS minutes count 10x on private repos.
#
# Memory: the first run (macos-26-arm64 image, which reported 5 CPU / 14 GB) died in gulp compile-src with
# "JavaScript heap out of memory" at the 6144 MB V8 heap cap while 4.8 GB of RAM was still available and no
# swap was used: the cap was too low, not the machine too small. The Linux build's mitigations apply here too:
#   - separate gulp processes per step (fork/scripts/build.sh), so the compile's heap is freed before bundling;
#   - heap cap 8192 MB (VSCodium's own default; the Linux compile peaks around 7.3 GB). build.sh now writes the
#     cap into package.json's gulp script, where it is actually read (it used to stay at the prepare-time value).
# On a 7 GB runner (macos-14 class) that still fits: macOS swaps to disk on demand (VSCodium's CI builds with a
# 12288 MB cap on those), so no swap file is needed; free-disk.sh leaves plenty of room for it.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-latest, a larger-runner label, or self-hosted)
        type: string
        default: macos-latest
      max_old_space_size:
        description: Node heap cap for gulp, in MB
        type: string
        default: "12288"

permissions: {}


jobs:
  build:
    concurrency:
      group: build-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ inputs.runner || vars.BUILD_RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 150 # macOS minutes bill at 10x on private repos
    permissions:
      contents: read
    env:
      MAX_OLD_SPACE_SIZE: ${{ inputs.max_old_space_size || vars.BUILD_MAX_OLD_SPACE_SIZE_MACOS || '12288' }}
      CI_BUILD: "yes"
      OS_NAME: osx
      VSCODE_ARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        run: |
          . fork/upstream.env
          . fork/branding.env
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vscodium=${VSCODIUM_REF}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"
          echo "app=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: fork/ci/free-disk.sh

      - name: Start resource monitor
        run: |
          echo "WORKDIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/build"
          fork/ci/monitor.sh start "$RUNNER_TEMP/resources.log" "$RUNNER_TEMP/build"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install jq
        run: command -v jq || brew install jq

      - name: Cache npm and Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
          key: build-macos-${{ steps.pins.outputs.vscodium }}-${{ hashFiles('package-lock.json') }}
          restore-keys: build-macos-${{ steps.pins.outputs.vscodium }}-

      - name: Check prerequisites (same check a local build runs first)
        run: fork/scripts/build-macos.sh --check "$WORKDIR"

      - name: Build (fork/scripts/build-macos.sh, as locally; prepare + compile + package + ad-hoc sign)
        run: |
          start=$(date +%s)
          fork/scripts/build-macos.sh "$WORKDIR"
          echo "BUILD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Package
        run: |
          cd "$WORKDIR/vscodium/VSCode-darwin-arm64"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.pins.outputs.app }}.app" "$RUNNER_TEMP/${{ steps.pins.outputs.binary }}-darwin-arm64.zip"
          ls -lh "$RUNNER_TEMP"/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/*.zip
          retention-days: 7

      - name: Resource summary
        if: always()
        run: |
          {
            echo "### macOS build resources"
            echo "- runner: \`${{ inputs.runner || vars.BUILD_RUNNER_MACOS || 'macos-latest' }}\`, $(sysctl -n hw.ncpu) CPU, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB RAM, heap cap ${MAX_OLD_SPACE_SIZE} MB"
            echo "- prepare + build: ${BUILD_S:-n/a} s"
            echo "- $(fork/ci/monitor.sh summary "$RUNNER_TEMP/resources.log")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Unsigned (Linux) / ad-hoc signed, not notarized (macOS) build of $TAG. On macOS run: xattr -dr com.apple.quarantine editor.app"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*.zip
