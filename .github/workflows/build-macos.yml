name: Full build - macOS

# Same triggers and runner rules as build-linux.yml (pre-merge only, configurable runner label);
# the on-demand PR label for macOS alone is `full-build-macos`. macOS minutes bill at 10x on private repos.
# Default runner: macos-latest (Apple Silicon). Unsigned for now (no Developer ID yet), so users must
# right-click > Open the first time. Note: macOS minutes on private repos count 10x against the free allowance.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-latest, a larger-runner label, or self-hosted)
        type: string
        default: macos-latest
      max_old_space_size:
        description: Node heap cap for gulp, in MB
        type: string
        default: "6144"
  pull_request:
    types: [ready_for_review, labeled]
  merge_group:
  push:
    tags: ["v*"]

permissions: {}


jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'ready_for_review') ||
      (github.event.action == 'labeled' && contains(fromJSON('["ready-to-merge", "full-build", "full-build-macos"]'), github.event.label.name))
    concurrency:
      group: build-macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ${{ inputs.runner || vars.BUILD_RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 150 # macOS minutes bill at 10x on private repos
    permissions:
      contents: read
    env:
      MAX_OLD_SPACE_SIZE: ${{ inputs.max_old_space_size || vars.BUILD_MAX_OLD_SPACE_SIZE_MACOS || '6144' }}
      CI_BUILD: "yes"
      OS_NAME: osx
      VSCODE_ARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        run: |
          . fork/upstream.env
          . fork/branding.env
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vscodium=${VSCODIUM_REF}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY_NAME}" >> "$GITHUB_OUTPUT"
          echo "app=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: fork/ci/free-disk.sh

      - name: Start resource monitor
        run: |
          echo "WORKDIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/build"
          fork/ci/monitor.sh start "$RUNNER_TEMP/resources.log" "$RUNNER_TEMP/build"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install jq
        run: command -v jq || brew install jq

      - name: Cache npm and Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
          key: build-macos-${{ steps.pins.outputs.vscodium }}-${{ hashFiles('package-lock.json') }}
          restore-keys: build-macos-${{ steps.pins.outputs.vscodium }}-

      - name: Install repo dependencies (engine + extension)
        run: npm ci

      - name: Prepare (VSCodium patches + ours + npm ci + built-in extension)
        run: |
          start=$(date +%s)
          fork/scripts/prepare-vscodium.sh "$WORKDIR"
          echo "PREPARE_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Build
        run: |
          start=$(date +%s)
          fork/scripts/build.sh "$WORKDIR"
          echo "BUILD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Package
        run: |
          cd "$WORKDIR/vscodium/VSCode-darwin-arm64"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.pins.outputs.app }}.app" "$RUNNER_TEMP/${{ steps.pins.outputs.binary }}-darwin-arm64.zip"
          ls -lh "$RUNNER_TEMP"/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/*.zip
          retention-days: 7

      - name: Resource summary
        if: always()
        run: |
          {
            echo "### macOS build resources"
            echo "- runner: \`${{ inputs.runner || vars.BUILD_RUNNER_MACOS || 'macos-latest' }}\`, $(sysctl -n hw.ncpu) CPU, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB RAM, heap cap ${MAX_OLD_SPACE_SIZE} MB"
            echo "- prepare: ${PREPARE_S:-n/a} s, build: ${BUILD_S:-n/a} s"
            echo "- $(fork/ci/monitor.sh summary "$RUNNER_TEMP/resources.log")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Unsigned build of $TAG."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*.zip
