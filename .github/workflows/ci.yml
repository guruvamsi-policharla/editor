name: CI

# One cheap Linux job on PRs: the patch series for macOS and Linux, and the repo's lint. Nothing runs on plain
# pushes. GitHub minutes are expensive, so the rest runs locally (fork/scripts/check-local.sh) or by hand
# (full-checks.yml, build-linux.yml, build-macos.yml).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Patch series + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned versions
        id: pins
        run: |
          . fork/upstream.env
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - name: Patch series applies for macOS and Linux, fork/src matches
        run: fork/scripts/check-patches.sh
      - run: npm ci
      - run: npm run lint
