<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editor</title>
  <meta name="description" content="a harness-agnostic editor">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta property="og:title" content="editor">
  <meta property="og:description" content="a harness-agnostic editor">
  <meta property="og:image" content="https://guruvamsi-policharla.github.io/editor/social-preview.png">
  <meta property="og:url" content="https://guruvamsi-policharla.github.io/editor/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #0E0F11;
      --fg: #FFFFFF;
      --muted: #8A8F98;
      --tile: #17181B;
      --line: rgba(138, 143, 152, 0.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      padding: 80px 0 88px;
      text-align: center;
    }
    .logo {
      width: 112px;
      height: 112px;
      display: block;
      margin: 0 auto 28px;
    }
    h1 {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -0.045em;
      margin: 0 0 14px;
    }
    .lede {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      margin: 0 auto 40px;
      max-width: 34em;
    }
    .term {
      display: flex;
      align-items: stretch;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      text-align: left;
      margin: 0 0 18px;
    }
    .term code {
      flex: 1;
      padding: 14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--fg);
      overflow-x: auto;
      white-space: nowrap;
    }
    .term button {
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 16px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }
    .term button:hover,
    .term button:focus {
      color: var(--fg);
      outline: none;
    }
    .btn {
      display: inline-block;
      background: var(--fg);
      color: var(--bg);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 10px;
    }
    .btn:hover { opacity: 0.92; }
    .version {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
      min-height: 1.2em;
    }
    footer {
      margin-top: 80px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 640px) {
      main { padding: 52px 0 64px; }
      h1 { font-size: 36px; }
      .term code { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icon.svg" width="112" height="112" alt="editor logo">
    <h1>editor</h1>
    <p class="lede">a harness-agnostic editor</p>

    <div class="term">
      <code id="install-cmd">curl -fsSL https://guruvamsi-policharla.github.io/editor/install.sh | sh</code>
      <button type="button" id="copy-btn" aria-label="Copy install command">Copy</button>
    </div>
    <a class="btn" id="download" href="https://github.com/guruvamsi-policharla/editor/releases/latest">Download for Apple Silicon</a>
    <span class="version" id="version"></span>

    <footer>
      <a href="https://github.com/guruvamsi-policharla/editor">Source</a>
      · MIT License
    </footer>
  </main>
  <script>
    (function () {
      var cmd = document.getElementById("install-cmd");
      var copyBtn = document.getElementById("copy-btn");
      copyBtn.addEventListener("click", function () {
        var text = cmd.textContent;
        var done = function () {
          copyBtn.textContent = "Copied";
          setTimeout(function () { copyBtn.textContent = "Copy"; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {
            window.getSelection().selectAllChildren(cmd);
          });
        } else {
          window.getSelection().selectAllChildren(cmd);
        }
      });

      fetch("https://api.github.com/repos/guruvamsi-policharla/editor/releases/latest")
        .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
        .then(function (rel) {
          var assets = rel.assets || [];
          var dmg = null;
          for (var i = 0; i < assets.length; i++) {
            if (/^editor-.+-darwin-arm64\.dmg$/.test(assets[i].name)) {
              dmg = assets[i];
              break;
            }
          }
          var download = document.getElementById("download");
          var version = document.getElementById("version");
          if (dmg && dmg.browser_download_url) {
            download.href = dmg.browser_download_url;
          }
          if (rel.tag_name) {
            version.textContent = rel.tag_name;
            download.textContent = "Download " + rel.tag_name;
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
